name: Windows build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Download Npcap SDK
        shell: pwsh
        run: |
          Invoke-WebRequest https://npcap.com/dist/npcap-sdk-1.15.zip -OutFile npcap-sdk.zip
          Expand-Archive npcap-sdk.zip -DestinationPath Npcap-SDK
      - name: Configure
        run: cmake -S . -B build -A x64 -DNPCAP_SDK=${{ github.workspace }}/Npcap-SDK
      - name: Build
        run: cmake --build build --config Release
